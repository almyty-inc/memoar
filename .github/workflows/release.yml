name: release

# Builds the capture agent for every platform the launcher knows about, and —
# only when asked — publishes them where `npx memoar` can find them.
#
# Nothing here publishes by accident. A tag builds and attaches assets to a
# GitHub Release; the npm package goes out only on an explicit dispatch with
# `publish_npm: true`. Both are one-way doors: a release tag is public the
# moment the repository is, and an npm version cannot be replaced once it is
# out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading v)
        required: true
        type: string
      build_binaries:
        description: Build every platform binary the launcher can ask for (skip for a launcher-only npm publish)
        type: boolean
        default: false
      publish_release:
        description: Attach the binaries to a GitHub Release
        type: boolean
        default: false
      publish_npm:
        description: Publish the launcher to npm (irreversible)
        type: boolean
        default: false

permissions:
  contents: write
  # npm authenticates this workflow by its GitHub Actions identity rather than
  # by a stored token — the same trusted-publishing setup almyty uses. There is
  # no NPM_TOKEN to create, rotate, or leak into a transcript.
  id-token: write

env:
  # The launcher asks for ${base}/v${version}/${asset}, so the asset names here
  # are the ones `lib/platform.js` computes. They are not free-form.
  CARGO_TERM_COLOR: always

jobs:
  # Only when binaries are actually wanted.
  #
  # This ran unconditionally, so publishing the launcher to npm — which needs
  # no binary at all — compiled every target first, two of them on macOS
  # runners, which bill at ten times the Linux rate. Three npm attempts failed
  # at the publish step having built all of it for nothing.
  build:
    name: ${{ matrix.target }}
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event.inputs.publish_release == 'true'
      || github.event.inputs.build_binaries == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Windows on ARM. `lib/platform.js` has mapped win32-arm64 here since
          # the launcher was written and nothing ever built it: v0.3.0 shipped
          # five assets, and `npx memoar` on an ARM Windows machine asked for
          # memoar-aarch64-pc-windows-msvc.exe and got a 404. Cross-compiled on
          # the x64 runner, whose Visual Studio image carries the ARM64
          # toolchain — and so, like aarch64 Linux, not runnable where built.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Without this every run compiles the whole dependency graph from scratch
      # on five runners, two of them billed at ten times the rate.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.target }}

      - name: Cross-compilation linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        working-directory: agent
        shell: bash
        env:
          # Cargo needs to be told which linker to hand an object file from a
          # different architecture.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release -p memoar-cli --target ${{ matrix.target }}

      - name: Name the asset and record its digest
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *windows*) suffix=".exe" ;;
            *)         suffix="" ;;
          esac
          asset="memoar-${{ matrix.target }}${suffix}"
          mkdir -p dist
          cp "agent/target/${{ matrix.target }}/release/memoar${suffix}" "dist/${asset}"
          cd dist
          # The launcher reads the first field of this file and refuses the
          # download when it does not match what it fetched.
          if command -v sha256sum >/dev/null; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi
          cat "${asset}.sha256"
          echo "name=${asset}" >> "$GITHUB_OUTPUT"

      # The natively-built ones only: a cross-compiled binary cannot run on the
      # runner that produced it. Named explicitly rather than matched by
      # substring, which would silently start skipping the wrong target.
      - name: The binary must run on the machine that built it
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: ./dist/${{ steps.asset.outputs.name }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  verify:
    name: The launcher resolves what was built
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: assets

      # The step below resolves through the launcher on *this* runner, which is
      # linux-x64, so it says nothing about the other five platforms the
      # launcher claims to serve — which is how win32-arm64 sat in `TARGETS`
      # for a release with nothing building it. Comparing the two lists is the
      # only check that covers a platform no runner here happens to be.
      - name: Every platform the launcher offers was actually built
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f ! -name '*.sha256' -exec basename {} \; | sort > built.txt
          echo "built:"; cat built.txt
          node -e '
            const fs = require("node:fs");
            const { assetName } = require("./packages/npx/lib/platform");
            const built = new Set(fs.readFileSync("built.txt", "utf8").split("\n").filter(Boolean));
            // Every pair the launcher will answer for, taken from the launcher
            // itself rather than restated here — a copy of the list is a second
            // thing to keep in step, and this check exists because two lists
            // drifted.
            const pairs = [
              ["darwin", "arm64"], ["darwin", "x64"],
              ["linux", "arm64"], ["linux", "x64"],
              ["win32", "arm64"], ["win32", "x64"],
            ];
            const missing = pairs
              .map(([platform, architecture]) => [`${platform}-${architecture}`, assetName(platform, architecture)])
              .filter(([, asset]) => !built.has(asset));
            if (missing.length > 0) {
              for (const [pair, asset] of missing) {
                console.error(`${pair}: the launcher downloads ${asset}, which this release does not contain`);
              }
              process.exit(1);
            }
            console.log(`all ${pairs.length} platforms the launcher offers have an asset`);
          '

      # Serving the assets the way a release does, and resolving through the
      # real launcher, is the only way to know the names, the layout and the
      # checksums agree before anyone runs `npx memoar`.
      - name: Download, verify and execute through the launcher
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          mkdir -p "serve/v${version}"
          find assets -type f -exec cp {} "serve/v${version}/" \;
          ls -l "serve/v${version}"
          npx --yes http-server serve -p 8799 --silent &
          for _ in $(seq 1 30); do
            curl -sf "http://127.0.0.1:8799/v${version}/" >/dev/null && break
            sleep 1
          done
          MEMOAR_DOWNLOAD_BASE=http://127.0.0.1:8799 \
          XDG_CACHE_HOME="$PWD/cache" \
          node -e '
            const { ensureBinary } = require("./packages/npx/lib/platform");
            const { execFileSync } = require("node:child_process");
            ensureBinary({ version: process.env.VERSION, localCandidates: [] })
              .then((binary) => {
                console.log("resolved", binary);
                console.log(execFileSync(binary, ["--version"]).toString().trim());
              })
              .catch((error) => { console.error(error.message); process.exit(1); });
          '
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}

  # Assets are attached to this repository's own releases, which is what the
  # launcher downloads from. That works without any stored credential —
  # GITHUB_TOKEN can write releases here — and it is the reason the repository
  # is public: a private repository's release assets need authentication, and
  # `npx` has none.
  release:
    name: Publish binaries
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten
        run: mkdir -p dist && find assets -type f -exec cp {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true

  # Deliberately not `needs: release`. The launcher and the agent are separate
  # artifacts with separate versions: fixing a URL or a README in the launcher
  # must not require cutting an agent release, and the agent's version is the
  # canonical contract's, which does not move because a Node package needed
  # republishing. The launcher's tests hold AGENT_VERSION to a release that
  # exists, which is the constraint that actually matters.
  npm:
    name: npm
    if: github.event.inputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: The launcher's own checks
        working-directory: packages/npx
        run: npm run check --workspaces=false && npm test --workspaces=false

      # The version in package.json selects which release the launcher
      # downloads, so publishing one that does not match the tag would 404 for
      # every installer. A test already holds it to the agent's version; this
      # holds it to the thing actually being released.
      - name: The published version must be the one that was built
        working-directory: packages/npx
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.version || github.ref_name }}"
          expected="${tag#v}"
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "$expected" || {
            echo "packages/npx is $actual but the release is $expected"
            exit 1
          }

      - name: Publish
        working-directory: packages/npx
        run: |
          # OIDC trusted publishing needs npm 11.5 or newer. Nothing is stored:
          # npm verifies the workflow's id-token against the trusted publisher
          # registered for this repository and workflow file on npmjs.com.
          npm install -g npm@latest
          npm publish --access public --provenance
