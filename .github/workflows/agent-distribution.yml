name: Agent distribution (non-publishing)

# A pull-request-only trigger is how this workflow stayed broken on two of its
# three runners for a fortnight: `ci.yml` and `build-publish.yml` both run on
# pushes to main, work lands on main directly, and a job that only ever runs on
# a pull request is a job that reports nothing about what is actually shipped.
# The same paths gate both triggers, so a push that touches neither the agent
# nor the launcher still costs nothing.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "packages/npx/**"
      - ".github/workflows/agent-distribution.yml"
  pull_request:
    paths:
      - "agent/**"
      - "packages/npx/**"
      - ".github/workflows/agent-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

# This workflow holds two macOS and two Windows runners for most of eight
# minutes, and macOS bills at ten times the Linux rate. Two pushes to the same
# branch inside that window ran both matrices to completion for one answer;
# superseding the older one is the difference. Never cancelled on main, where
# the run is the record of what was shipped rather than feedback on a draft.
concurrency:
  group: agent-distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-rust:
    name: Native Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Without this the whole dependency graph is compiled from scratch, four
      # times over (check, clippy, test, release build), on three runners —
      # two of which are the expensive ones. `ci.yml` and `release.yml` both
      # cache; this job was the one that did not, and it is the one that runs
      # the most compilers.
      #
      # Keyed per OS because the matrix shares a cache namespace otherwise and
      # a macOS target would keep evicting the Windows one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.os }}
      - name: Record native target
        run: rustc -vV
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The desktop application is not a member of this workspace any more. It
      # is an NSH app with a workspace of its own, tested and packaged on all
      # three desktops by the `desktop` job below.
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build release binary
        run: cargo build --release -p memoar-cli
      - name: Exercise compiled robot contract
        run: cargo test -p memoar-cli --test robot_cli
      # A real install, crash, stop and uninstall of the background service in
      # each platform's own service manager, for a scratch configuration under
      # a unique name. The unit tests cover the definitions as text, and only
      # this shows that launchd, systemd and Task Scheduler accept them.
      - name: Background service (launchd)
        if: runner.os == 'macOS'
        run: sh scripts/service-smoke.sh "$PWD/target/release/memoar"
      # The runner has no login session, so its user manager is started the
      # way a lingering user's is. The CLI itself only ever suggests this.
      - name: Background service (systemd --user)
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/bus" ] && break
            sleep 1
          done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sh scripts/service-smoke.sh "$PWD/target/release/memoar"
      - name: Background service (Task Scheduler)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/service-smoke.ps1 -Memoar "$PWD\target\release\memoar.exe"

  # The desktop application on every desktop it ships for: native AppKit,
  # GTK 4 and Win32 windows drawn by NSH. Each runner builds, lints and tests
  # it, drives the window headless with `nsh test` against a stand-in archive,
  # then packages it with the same script a release calls, and keeps the
  # package as an artifact. Windows is verified here and nowhere else.
  desktop:
    name: Desktop app / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent/crates/memoar-desktop
          key: desktop-${{ matrix.os }}
          cache-bin: false
      # NSH's Linux backend is GTK 4, 4.14 or later: Ubuntu 24.04's. The
      # packaged Linux runner (nsh-linux-app) also links WebKitGTK 6.0, whose
      # development package brings libsoup 3 and JavaScriptCore with it.
      - name: Install GTK 4 and WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # Pinned to the `nsh-*` crates in the desktop's Cargo.toml, and cached
      # because building the CLI costs more than the rest of the job. Saved as
      # soon as it is built, so a later failing step does not throw it away.
      - name: Restore the nsh CLI
        id: nsh-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/nsh
            ~/.cargo/bin/nsh.exe
          key: nsh-cli-0.2.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install the nsh CLI
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        run: cargo install nsh-cli --version 0.2.0 --locked
      - name: Save the nsh CLI
        if: steps.nsh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/nsh
            ~/.cargo/bin/nsh.exe
          key: nsh-cli-0.2.0-${{ runner.os }}-${{ runner.arch }}
      - name: Formatting and lints
        working-directory: agent/crates/memoar-desktop
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests and headless window tests
        run: agent/scripts/test-desktop.sh --junit desktop-junit.xml
      - name: Package
        id: package
        run: agent/scripts/package-desktop.sh
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: memoar-desktop-${{ runner.os }}
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memoar-desktop-tests-${{ runner.os }}
          path: agent/crates/memoar-desktop/desktop-junit.xml
          if-no-files-found: ignore
      # The real window on this desktop, both screens, light and dark, so a
      # change to how it looks can be seen on all three without a machine of
      # each. Linux draws into Xvfb with GTK's software renderer.
      - name: Install Xvfb and ImageMagick
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb imagemagick
      - name: Screenshots
        env:
          GSK_RENDERER: cairo
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1024x768x24" agent/scripts/screenshot-desktop.sh desktop-screenshots
          else
            agent/scripts/screenshot-desktop.sh desktop-screenshots
          fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memoar-desktop-screenshots-${{ runner.os }}
          path: desktop-screenshots
          if-no-files-found: warn

  wrapper-and-installer:
    name: Wrapper platform/checksum/cache matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npx/package-lock.json
      - name: Syntax and POSIX checks
        run: npm run check --workspaces=false
      - name: Platform, checksum, cache, lock, and installer tests
        run: npm test --workspaces=false
      # The package is publishable now, so "it stays private" is no longer the
      # thing worth asserting. What matters is that publishing it never ships
      # anything but the launcher: five files, no source, no fixtures, no keys.
      - name: The published tarball contains the launcher and nothing else
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const [pack] = require("./pack.json");
            const files = pack.files.map((file) => file.path).sort();
            const expected = ["README.md", "bin/memoar.js", "install.sh", "lib/platform.js", "package.json"];
            const difference = files.filter((file) => !expected.includes(file));
            if (difference.length > 0) {
              console.error("unexpected files in the published tarball:", difference);
              process.exit(1);
            }
            console.log("tarball contents:", files.join(", "));
          '
