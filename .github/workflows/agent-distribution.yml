name: Agent distribution (non-publishing)

# A pull-request-only trigger is how this workflow stayed broken on two of its
# three runners for a fortnight: `ci.yml` and `build-publish.yml` both run on
# pushes to main, work lands on main directly, and a job that only ever runs on
# a pull request is a job that reports nothing about what is actually shipped.
# The same paths gate both triggers, so a push that touches neither the agent
# nor the launcher still costs nothing.
on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "packages/npx/**"
      - ".github/workflows/agent-distribution.yml"
  pull_request:
    paths:
      - "agent/**"
      - "packages/npx/**"
      - ".github/workflows/agent-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

# This workflow holds two macOS and two Windows runners for most of eight
# minutes, and macOS bills at ten times the Linux rate. Two pushes to the same
# branch inside that window ran both matrices to completion for one answer;
# superseding the older one is the difference. Never cancelled on main, where
# the run is the record of what was shipped rather than feedback on a draft.
concurrency:
  group: agent-distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-rust:
    name: Native Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Without this the whole dependency graph is compiled from scratch, four
      # times over (check, clippy, test, release build), on three runners —
      # two of which are the expensive ones. `ci.yml` and `release.yml` both
      # cache; this job was the one that did not, and it is the one that runs
      # the most compilers.
      #
      # Keyed per OS because the matrix shares a cache namespace otherwise and
      # a macOS target would keep evicting the Windows one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.os }}
      - name: Record native target
        run: rustc -vV
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The desktop app is excluded here, on every platform, so the exclusion
      # cannot drift between them. It draws with the system WebView, which needs
      # a GTK toolchain on Linux and an icon this repository does not ship on
      # Windows — neither of which this workflow installs, because this workflow
      # is about distributing the CLI and the npx launcher. `ci.yml` builds and
      # tests it on Linux with the right packages.
      #
      # It had been failing on two of these three runners since the desktop
      # crate landed on 2026-09-04, and nobody could know: this workflow only
      # runs on pull requests, and there had not been one.
      - name: Check all targets
        run: cargo check --workspace --exclude memoar-desktop --all-targets
      - name: Clippy
        run: cargo clippy --workspace --exclude memoar-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude memoar-desktop --all-targets
      - name: Build release binary
        run: cargo build --release -p memoar-cli
      - name: Exercise compiled robot contract
        run: cargo test -p memoar-cli --test robot_cli

  wrapper-and-installer:
    name: Wrapper platform/checksum/cache matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npx/package-lock.json
      - name: Syntax and POSIX checks
        run: npm run check --workspaces=false
      - name: Platform, checksum, cache, lock, and installer tests
        run: npm test --workspaces=false
      # The package is publishable now, so "it stays private" is no longer the
      # thing worth asserting. What matters is that publishing it never ships
      # anything but the launcher: five files, no source, no fixtures, no keys.
      - name: The published tarball contains the launcher and nothing else
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const [pack] = require("./pack.json");
            const files = pack.files.map((file) => file.path).sort();
            const expected = ["README.md", "bin/memoar.js", "install.sh", "lib/platform.js", "package.json"];
            const difference = files.filter((file) => !expected.includes(file));
            if (difference.length > 0) {
              console.error("unexpected files in the published tarball:", difference);
              process.exit(1);
            }
            console.log("tarball contents:", files.join(", "));
          '
