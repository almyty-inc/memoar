name: Agent distribution (non-publishing)

on:
  pull_request:
    paths:
      - "agent/**"
      - "packages/npx/**"
      - ".github/workflows/agent-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rust:
    name: Native Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Record native target
        run: rustc -vV
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build release binary
        run: cargo build --release -p memoar-cli
      - name: Exercise compiled robot contract
        run: cargo test -p memoar-cli --test robot_cli

  wrapper-and-installer:
    name: Wrapper platform/checksum/cache matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/npx/package-lock.json
      - name: Syntax and POSIX checks
        run: npm run check --workspaces=false
      - name: Platform, checksum, cache, lock, and installer tests
        run: npm test --workspaces=false
      # Publishing happens in release.yml, behind an explicit dispatch input and
      # an NPM_TOKEN. This guard keeps the package from going out as a side
      # effect of anything else; clearing `private` is the deliberate act that
      # opts the launcher into the registry.
      - name: Prove the package does not publish as a side effect
        run: node -e 'const p=require("./package.json"); if (p.private !== true) process.exit(1)'
