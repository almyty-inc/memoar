[package]
name = "memoar-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
hex.workspace = true
memoar-connectors = { path = "../memoar-connectors" }
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
# Codex compresses cold rollouts with zstd. A pure-Rust decoder, so every
# platform builds it without a C toolchain. Its encoder writes the test frames.
ruzstd = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zip.workspace = true

# Free space on the volume that holds the queue, for the disk guard. Safe
# `statvfs` on Unix; Windows has no safe wrapper, see `space.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
