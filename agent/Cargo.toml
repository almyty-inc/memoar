[workspace]
members = [
  "crates/memoar-canonical",
  "crates/memoar-connectors",
  "crates/memoar-daemon",
  "crates/memoar-materializer",
  "crates/memoar-cli",
]
# The desktop application is a workspace of its own: NSH generates runner
# crates beside it and builds them against it, and its native toolkits are not
# something every CLI build should need. See "The desktop application" in
# docs/install.md.
exclude = ["crates/memoar-desktop"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
# `memoar tui`. Its crossterm backend is the one the CLI uses, through
# `ratatui::crossterm`, so the two can never disagree on a version.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls", "rustls-native-certs"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
# Code blocks in `memoar tui` transcripts. Pure Rust regexes, so no C
# toolchain on any of the three desktops, and only the grammars: colours come
# from the terminal's own palette, not a bundled theme.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
thiserror = "2"
# Already in the tree through ratatui. The TUI wraps transcript text itself, so
# it needs the same idea of how wide a character is.
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
