# Every service restarts on its own. Docker went down mid-run once and took the
# whole stack with it: nothing brought it back, and an archive that needs a
# person to notice and restart it is not running.
name: memoar-dev

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memoar
      POSTGRES_USER: memoar
      POSTGRES_PASSWORD: memoar
    ports:
      - "${MEMOAR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      # Backups are taken from inside this container, where the client is the
      # same major version as the server; see docs/backup.md.
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoar -d memoar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MEMOAR_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for this stack only. A deployed instance uses
  # DigitalOcean Spaces (see .env.example). This was MinIO until its images
  # stopped being anonymously pullable. RustFS is Apache-2.0, publishes an
  # immutable tag per release on Docker Hub, and supports what Memoar relies
  # on: path-style and virtual-hosted addressing, pre-signed GET and PUT,
  # multipart upload, HEAD, and bucket versioning.
  #
  # The old MEMOAR_MINIO_* port variables still work as fallbacks. The data
  # lives in a new volume, `s3-data`, so RustFS never starts on files MinIO
  # wrote. `minio-data` stays declared so an existing stack keeps it. See
  # docs/getting-started.md for carrying old objects across.
  s3:
    restart: unless-stopped
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: memoar-local
      RUSTFS_SECRET_KEY: memoar-local-secret
      RUSTFS_REGION: eu-central-1
      RUSTFS_CONSOLE_ENABLE: "true"
      # Hosts that route `<bucket>.<host>` to the bucket, which is what
      # S3_FORCE_PATH_STYLE=false asks for. Without this only path-style works.
      RUSTFS_SERVER_DOMAINS: s3:9000,localhost:${MEMOAR_S3_PORT:-${MEMOAR_MINIO_PORT:-59000}}
    ports:
      - "${MEMOAR_S3_PORT:-${MEMOAR_MINIO_PORT:-59000}}:9000"
      - "${MEMOAR_S3_CONSOLE_PORT:-${MEMOAR_MINIO_CONSOLE_PORT:-59001}}:9001"
    volumes:
      - s3-data:/data
    networks:
      default:
        # Resolves the virtual-hosted name of the bucket inside the stack.
        aliases:
          - memoar-raw.s3
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Takes the backup nobody would otherwise remember to take. Runs the same
  # scripts an operator runs by hand, in the database's own image so that the
  # client and the server are the same major version — a mismatched pg_dump
  # writes a file that fails part way through a restore.
  backup:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    entrypoint: ["sh", "/backup-cron.sh"]
    environment:
      MEMOAR_BACKUP_URL: postgres://memoar:memoar@postgres:5432/memoar
      MEMOAR_BACKUP_INTERVAL_SECONDS: ${MEMOAR_BACKUP_INTERVAL_SECONDS:-86400}
      MEMOAR_BACKUP_KEEP: ${MEMOAR_BACKUP_KEEP:-14}
      # The health check below reads the interval and allows one and a half of
      # them, so changing the schedule moves the alarm with it. Set this only to
      # override that.
      MEMOAR_BACKUP_MAX_AGE_SECONDS: ${MEMOAR_BACKUP_MAX_AGE_SECONDS:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backup-cron.sh:/backup-cron.sh:ro
      - ./backup-check.sh:/backup-check.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Unhealthy means no backup has succeeded recently — the failure that
      # otherwise goes unnoticed for months, because nothing else looks any
      # different.
      test: ["CMD", "sh", "/backup-check.sh"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 120s

  # The half of the archive that backup.sh deliberately does not copy.
  #
  # Postgres holds the parsed sessions; this holds the raw bytes they were
  # parsed from, and docs/backup.md says those are protected by bucket
  # versioning rather than by a nightly dump — because they are
  # content-addressed and immutable, so what they need is protection from
  # deletion rather than a copy of yesterday's copy.
  #
  # That protection was written down and never turned on. Creating the bucket
  # alone leaves it un-versioned, and an un-versioned delete is final: restoring
  # the database then gives an archive whose sessions all point at objects that
  # are gone. Enabling it here costs nothing and makes the stack match the only
  # thing anybody was told about it. Idempotent, like the bucket creation.
  #
  # `rc` is the RustFS client that ships in the server image, so this needs no
  # second image. It reads the alias from RC_HOST_<name>. The last command
  # prints the versioning status and fails the stack if it is not Enabled.
  s3-create-bucket:
    image: rustfs/rustfs:1.0.6
    depends_on:
      s3:
        condition: service_healthy
    environment:
      RC_CONFIG_DIR: /tmp/rc
      RC_HOST_local: http://memoar-local:memoar-local-secret@s3:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "rc bucket create --ignore-existing local/memoar-raw && rc bucket version enable local/memoar-raw && rc bucket version info --json local/memoar-raw | grep -q '\"status\": *\"Enabled\"'"

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      # Where pre-signed URLs point: the published port, which is what the
      # agent and the browser reach from the host. The server's own fallback is
      # port 59000, so without this a moved port signs URLs for the wrong one.
      S3_PUBLIC_ENDPOINT: http://localhost:${MEMOAR_S3_PORT:-${MEMOAR_MINIO_PORT:-59000}}
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_TOKEN_SECRET: local-development-only-change-me
      MEMOAR_RUN_MIGRATIONS: "true"
      # The first account for this local stack. Nothing else is created: the
      # archive starts empty and fills up with what the agent captures.
      MEMOAR_BOOTSTRAP_EMAIL: ${MEMOAR_BOOTSTRAP_EMAIL:-owner@memoar.local}
      MEMOAR_BOOTSTRAP_PASSWORD: ${MEMOAR_BOOTSTRAP_PASSWORD:-local-stack-password-change-me}
      # Open here so the browser acceptance can create an account the way a
      # newcomer does. Closed is the default everywhere it is not stated.
      MEMOAR_SIGNUP: "open"
      # /v1/metrics exists only while this is set, and always requires it.
      MEMOAR_METRICS_TOKEN: ${MEMOAR_METRICS_TOKEN:-local-stack-metrics-token}
      # Encrypts the provider credentials accounts bring for distillation.
      # Without it the API refuses to store one rather than storing it weakly.
      MEMOAR_CREDENTIAL_KEY: ${MEMOAR_CREDENTIAL_KEY:-6b1f3c7d9a2e4f508192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8}
      # Failure counts survive a restart. Separate paths per process: the API
      # and the worker group their own failures, and one file would have each
      # overwriting the other.
      MEMOAR_ERROR_STATE_PATH: /var/lib/memoar/api-errors.json
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
    ports:
      - "4000:4000"
    volumes:
      # Survives a rebuild, which is when the error history is most wanted.
      - memoar-state:/var/lib/memoar
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      # Where pre-signed URLs point: the published port, which is what the
      # agent and the browser reach from the host. The server's own fallback is
      # port 59000, so without this a moved port signs URLs for the wrong one.
      S3_PUBLIC_ENDPOINT: http://localhost:${MEMOAR_S3_PORT:-${MEMOAR_MINIO_PORT:-59000}}
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_RUN_MIGRATIONS: "false"
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
      # The worker is not a web server, so it listens for scrapes and nothing
      # else. It is also the process that knows whether the queue is draining.
      MEMOAR_METRICS_TOKEN: ${MEMOAR_METRICS_TOKEN:-local-stack-metrics-token}
      MEMOAR_WORKER_METRICS_PORT: "9464"
      MEMOAR_ERROR_STATE_PATH: /var/lib/memoar/worker-errors.json
    volumes:
      - memoar-state:/var/lib/memoar
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/v1
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  memoar-state:
  postgres-backups:
  redis-data:
  # Held by stacks that ran MinIO. Nothing mounts it now. Kept so that
  # bringing such a stack up again does not orphan the old objects.
  minio-data:
  s3-data:
