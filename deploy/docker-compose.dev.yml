# Every service restarts on its own. Docker went down mid-run once and took the
# whole stack with it: nothing brought it back, and an archive that needs a
# person to notice and restart it is not running.
name: memoar-dev

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memoar
      POSTGRES_USER: memoar
      POSTGRES_PASSWORD: memoar
    ports:
      - "${MEMOAR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      # Backups are taken from inside this container, where the client is the
      # same major version as the server; see docs/backup.md.
      - ./backup.sh:/backup.sh:ro
      - ./restore.sh:/restore.sh:ro
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoar -d memoar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MEMOAR_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: memoar-local
      MINIO_ROOT_PASSWORD: memoar-local-secret
    ports:
      - "${MEMOAR_MINIO_PORT:-59000}:9000"
      - "${MEMOAR_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Takes the backup nobody would otherwise remember to take. Runs the same
  # scripts an operator runs by hand, in the database's own image so that the
  # client and the server are the same major version — a mismatched pg_dump
  # writes a file that fails part way through a restore.
  backup:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    entrypoint: ["sh", "/backup-cron.sh"]
    environment:
      MEMOAR_BACKUP_URL: postgres://memoar:memoar@postgres:5432/memoar
      MEMOAR_BACKUP_INTERVAL_SECONDS: ${MEMOAR_BACKUP_INTERVAL_SECONDS:-86400}
      MEMOAR_BACKUP_KEEP: ${MEMOAR_BACKUP_KEEP:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backup-cron.sh:/backup-cron.sh:ro
      - ./backup-check.sh:/backup-check.sh:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Unhealthy means no backup has succeeded recently — the failure that
      # otherwise goes unnoticed for months, because nothing else looks any
      # different.
      test: ["CMD", "sh", "/backup-check.sh"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 120s

  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 memoar-local memoar-local-secret && mc mb --ignore-existing local/memoar-raw"

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_TOKEN_SECRET: local-development-only-change-me
      MEMOAR_RUN_MIGRATIONS: "true"
      # The first account for this local stack. Nothing else is created: the
      # archive starts empty and fills up with what the agent captures.
      MEMOAR_BOOTSTRAP_EMAIL: ${MEMOAR_BOOTSTRAP_EMAIL:-owner@memoar.local}
      MEMOAR_BOOTSTRAP_PASSWORD: ${MEMOAR_BOOTSTRAP_PASSWORD:-local-stack-password-change-me}
      # Open here so the browser acceptance can create an account the way a
      # newcomer does. Closed is the default everywhere it is not stated.
      MEMOAR_SIGNUP: "open"
      # /v1/metrics exists only while this is set, and always requires it.
      MEMOAR_METRICS_TOKEN: ${MEMOAR_METRICS_TOKEN:-local-stack-metrics-token}
      # Encrypts the provider credentials accounts bring for distillation.
      # Without it the API refuses to store one rather than storing it weakly.
      MEMOAR_CREDENTIAL_KEY: ${MEMOAR_CREDENTIAL_KEY:-6b1f3c7d9a2e4f508192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8}
      # Failure counts survive a restart. Separate paths per process: the API
      # and the worker group their own failures, and one file would have each
      # overwriting the other.
      MEMOAR_ERROR_STATE_PATH: /var/lib/memoar/api-errors.json
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
    ports:
      - "4000:4000"
    volumes:
      # Survives a rebuild, which is when the error history is most wanted.
      - memoar-state:/var/lib/memoar
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_RUN_MIGRATIONS: "false"
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
      # The worker is not a web server, so it listens for scrapes and nothing
      # else. It is also the process that knows whether the queue is draining.
      MEMOAR_METRICS_TOKEN: ${MEMOAR_METRICS_TOKEN:-local-stack-metrics-token}
      MEMOAR_WORKER_METRICS_PORT: "9464"
      MEMOAR_ERROR_STATE_PATH: /var/lib/memoar/worker-errors.json
    volumes:
      - memoar-state:/var/lib/memoar
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/v1
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  memoar-state:
  postgres-backups:
  redis-data:
  minio-data:
