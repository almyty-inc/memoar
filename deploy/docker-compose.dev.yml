name: memoar-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: memoar
      POSTGRES_USER: memoar
      POSTGRES_PASSWORD: memoar
    ports:
      - "${MEMOAR_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoar -d memoar"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${MEMOAR_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: memoar-local
      MINIO_ROOT_PASSWORD: memoar-local-secret
    ports:
      - "${MEMOAR_MINIO_PORT:-59000}:9000"
      - "${MEMOAR_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 memoar-local memoar-local-secret && mc mb --ignore-existing local/memoar-raw"

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_TOKEN_SECRET: local-development-only-change-me
      MEMOAR_RUN_MIGRATIONS: "true"
      MEMOAR_SEED_DEMO: "true"
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://memoar_app:memoar_app@postgres:5432/memoar
      MIGRATION_DATABASE_URL: postgres://memoar:memoar@postgres:5432/memoar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-central-1
      S3_BUCKET: memoar-raw
      S3_ACCESS_KEY: memoar-local
      S3_SECRET_KEY: memoar-local-secret
      MEMOAR_RUN_MIGRATIONS: "false"
      MEMOAR_SEED_DEMO: "false"
      MEMOAR_EMBEDDINGS_PROVIDER: ${MEMOAR_EMBEDDINGS_PROVIDER:-deterministic}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
